<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- form practice -->
    <hr>
    <form action="index.php" method="post" enctype="multipart/form-data">
        <label for="username">-USERNAME-</label>
        <input type="text" id="username" placeholder="islam-first" minlength="6" maxlength="20" required>
      <br>
        <label for="password">-PASSWORD-</label>
        <input type="password" id="password" placeholder="choose a password" minlength="6" maxlength="20" required>
      <br>
        <label for="email">-EMAIL-</label>
        <input type="email" id="email" placeholder="input-email@gmail.com" minlength="6" maxlength="35" required>
      <br>
        <label for="phone">-PHONE NUMBER-</label>
        <input type="tel" id="phone" placeholder="518-000-0000" minlength="14" maxlength="14" required pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"> 
      <br>
        <label for="day">-DATE-</label>
        <input type="date" id="day">

        <br>
         <label for="qun">-QUANTITY-</label>
        <input type="number" id="qun" placeholder="0-99" min="1" max="99" value="1">
      <br>

      
      <label for="title">-TITLE-</label>
      <br>
      <label for="mr">-MR.-</label>
      <input type="radio" id="mr" value="mr" name="title">
      <!-- radio buttons must be in same group in order to only select one option. this is done by giving the same name to all radio buttons in the group. -->
      <label for="mrs">-MRS.-</label>
      <input type="radio" id="mrs" value="mrs" name="title">
      
      <label for="phd">-PHD.-</label>
      <input type="radio" id="phd" value="phd" name="title">
      <br>
      <label for="payment">-PAYMENT METHOD-</label>
      <select name="payment" id="payment">
        <option value="credit">Credit Card</option>
        <option value="debit">Debit Card</option>
        <option value="cash">Cash</option>
      </select>
      <br>
      <label for="sub">-SUBSCRIBE-</label>
      <input type="checkbox" id="sub" value="subscribe">
      <br>
      <label for="comment">-COMMENT-</label>
      <textarea name="comment" id="comment" placeholder="Enter your comment here..."></textarea>
<br>
<label for="file">-FILE-</label> <!--accept-->
<input type="file" id="file" name="file">


      <br>
        <input type="submit" >
        <input type="reset">
    </form>
<hr>
</body>
</html>
